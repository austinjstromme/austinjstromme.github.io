---
layout: default
---

<article class="essay">
  <header class="essay-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
  </header>

  <div class="essay-body">
    {{ content }}
  </div>
</article>
