<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header{% if page.title == 'Home' %} home-header{% endif %}">
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/papers/' | relative_url }}">Papers</a>
        <a href="{{ '/blog/' | relative_url }}">Writings</a>
      </nav>
      {% unless page.title == 'Home' %}
        <a class="site-name" href="{{ '/' | relative_url }}">Austin J. Stromme</a>
      {% endunless %}
    </header>

    <main class="page-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      &copy; {{ 'now' | date: '%Y' }} Austin J. Stromme
    </footer>
  </body>
</html>
